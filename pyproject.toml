[build-system]
requires = ["setuptools==70.1.0", "wheel==0.43.0"]
build-backend = "setuptools.build_meta"

[project]
name = "glioma-shift-atlas"
version = "1.0.0"
description = "Multimodal therapy-responsive glioma microenvironment profiling"
requires-python = ">=3.11,<3.12"
license = {file = "LICENSE"}
dependencies = [
  "torch==2.3.0",
  "torchvision==0.18.0",
  "numpy==1.26.4",
  "pandas==2.2.2",
  "scipy==1.13.1",
  "scikit-learn==1.5.0",
  "pyyaml==6.0.1",
  "h5py==3.11.0",
  "anndata==0.10.8",
  "scanpy==1.10.1",
  "squidpy==1.6.0",
  "lifelines==0.28.0",
  "monai==1.4.0",
  "tifffile==2024.6.18",
  "pillow==10.3.0",
  "safetensors==0.4.3",
  "tqdm==4.66.4"
]

[project.scripts]
glioma-atlas = "glioma_shift_atlas.console:main"

[tool.setuptools]
package-dir = {"" = "code"}

[tool.setuptools.packages.find]
where = ["code"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.black]
line-length = 100
target-version = ["py311"]

[tool.mypy]
python_version = "3.11"
strict = true
packages = ["glioma_shift_atlas"]
